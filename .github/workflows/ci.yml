name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - run: python -m pip install -r requirements/development.txt
      - run: python -m ruff format --check --no-cache .
      - run: python -m ruff check --no-cache .
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python -m pytest -q
      - run: python manage.py spectacular --validate --fail-on-warn --settings=config.settings.test --file /tmp/schema.yaml

  backend-postgresql:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: test-only-secret-key
      TEST_DATABASE_ENGINE: postgresql
      EXPECTED_DATABASE_VENDOR: postgresql
      POSTGRES_DB: employee_management_test
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_CACHE_ENGINE: redis
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: employee_management_test
          POSTGRES_USER: employee_app
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U employee_app -d employee_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - run: python -m pip install -r requirements/development.txt
      - run: python -c "import os, redis; assert redis.from_url(os.environ['REDIS_URL']).ping()"
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q

  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/employee_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/employee_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=../../config/dev.android-emulator.json
      - run: test -f build/app/outputs/flutter-apk/app-debug.apk
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/employee_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug --dart-define-from-file=../../config/dev.windows.json
      - shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Debug/employee_app.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Windows Debug EXE missing." }
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose -f deploy/docker-compose.dev.yml config --quiet
      - shell: pwsh
        run: ./scripts/repository-safety.ps1

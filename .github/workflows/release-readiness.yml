name: Release Readiness Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-contract:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: validation-only-django-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7-A7
      JWT_SIGNING_KEY: validation-only-jwt-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8-B8
      DJANGO_ALLOWED_HOSTS: pilot.internal.example.com
      CORS_ALLOWED_ORIGINS: https://pilot.internal.example.com
      API_PUBLIC_BASE_URL: https://pilot.internal.example.com/api/v1
      POSTGRES_DB: employee_management
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: validation-only-postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: smtp.internal.example.com
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: validation-only-smtp
      EMAIL_HOST_PASSWORD: validation-only-smtp-password
      EMAIL_USE_TLS: "true"
      EMAIL_USE_SSL: "false"
      EMAIL_TIMEOUT: "10"
      DEFAULT_FROM_EMAIL: no-reply@internal.example.com
      SERVER_EMAIL: server@internal.example.com
      ACCOUNT_TOKEN_HMAC_ACTIVE_KID: validation-account-v1
      ACCOUNT_TOKEN_HMAC_KEYS_JSON: '{"validation-account-v1":"validation-only-account-key"}'
      AUDIT_ARCHIVE_HMAC_ACTIVE_KID: validation-audit-v1
      AUDIT_ARCHIVE_HMAC_KEYS_JSON: '{"validation-audit-v1":"validation-only-audit-key"}'
      AUDIT_ARCHIVE_DIR: /tmp/employee-audit-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - run: python -m pip install -r backend/requirements/base.txt
      - working-directory: backend
        run: python manage.py check --deploy --settings=config.settings.production
      - run: docker compose -f deploy/docker-compose.production.example.yml config --quiet
      - run: docker build -f deploy/backend/Dockerfile.production -t employee-management:validation .

  validation-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - working-directory: apps/employee_app
        run: flutter pub get
      - shell: powershell
        run: >-
          .\scripts\build-internal-release.ps1
          -Platform all
          -ConfigFile .\config\release.validation.json
          -OutputDirectory "${{ runner.temp }}\employee-release-validation"
          -ValidationOnly
          -AllowDevelopmentPlaceholders
      - shell: powershell
        run: >-
          .\scripts\verify-release-artifacts.ps1
          -ManifestPath "${{ runner.temp }}\employee-release-validation\manifest.json"
